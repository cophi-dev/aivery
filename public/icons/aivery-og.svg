<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <pattern id="dots" patternUnits="userSpaceOnUse" width="60" height="60">
      <circle cx="15" cy="15" r="2" fill="white" opacity="0.1"/>
      <circle cx="45" cy="45" r="2" fill="white" opacity="0.1"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#dots)"/>
  
  <!-- Main Content Container -->
  <g transform="translate(50, 0)">
    <!-- Logo Section -->
    <g transform="translate(0, 150)">
      <!-- Logo Background -->
      <rect x="0" y="0" width="80" height="80" rx="20" fill="white"/>
      <!-- Logo Text -->
      <text x="40" y="55" font-family="Inter, sans-serif" font-size="40" font-weight="bold" text-anchor="middle" fill="#4B9EFF">A</text>
      
      <!-- Brand Name -->
      <text x="100" y="55" font-family="Inter, sans-serif" font-size="48" font-weight="800" fill="white">Aivery</text>
    </g>
    
    <!-- Title -->
    <text x="0" y="280" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="white">
      <tspan x="0" dy="0">AI-Powered Fitness Training</tspan>
      <tspan x="0" dy="45">Intelligence</tspan>
    </text>
    
    <!-- Description -->
    <text x="0" y="380" font-family="Inter, sans-serif" font-size="24" font-weight="400" fill="white" opacity="0.9">
      <tspan x="0" dy="0">Transform your workout data into</tspan>
      <tspan x="0" dy="30">actionable intelligence</tspan>
    </text>
  </g>
  
  <!-- Visual Element -->
  <g transform="translate(700, 115)">
    <!-- Background Card -->
    <rect x="0" y="0" width="400" height="400" rx="20" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <rect x="20" y="20" width="360" height="360" rx="12" fill="rgba(255,255,255,0.05)"/>
    
    <!-- Fitness Icon -->
    <text x="200" y="250" font-family="Arial, sans-serif" font-size="120" text-anchor="middle" fill="white">💪</text>
  </g>
</svg>