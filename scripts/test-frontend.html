<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 1rem;
      max-width: 800px;
      margin: 0 auto;
      line-height: 1.5;
    }
    h1 {
      margin-bottom: 1rem;
    }
    button {
      background-color: #0070f3;
      color: white;
      border: none;
      border-radius: 4px;
      padding: 0.5rem 1rem;
      margin: 0.5rem 0.5rem 0.5rem 0;
      cursor: pointer;
      font-size: 1rem;
    }
    button:hover {
      background-color: #0060df;
    }
    pre {
      background-color: #f5f5f5;
      padding: 1rem;
      border-radius: 4px;
      overflow: auto;
      margin-top: 1rem;
    }
    .response-container {
      margin-top: 1rem;
      border-top: 1px solid #eaeaea;
      padding-top: 1rem;
    }
    .error {
      color: red;
    }
    .success {
      color: green;
    }
  </style>
</head>
<body>
  <h1>Anthropic Claude API Test</h1>
  <p>Click the buttons below to test the API endpoints with Anthropic Claude.</p>
  
  <div>
    <button onclick="testQuotes()">Test Quotes API</button>
    <button onclick="testDynamicQuotes()">Test Dynamic Quotes API</button>
    <button onclick="testMyStory()">Test My Story API</button>
  </div>
  
  <div class="response-container">
    <h2>Response:</h2>
    <pre id="response">No API call made yet.</pre>
  </div>
  
  <script>
    async function makeRequest(endpoint, method = 'GET', body = null) {
      try {
        const options = {
          method,
          headers: {
            'Content-Type': 'application/json',
          },
          credentials: 'include' // Important for authentication cookies
        };
        
        if (body) {
          options.body = JSON.stringify(body);
        }
        
        const response = await fetch(endpoint, options);
        const data = await response.json();
        return { success: true, data };
      } catch (error) {
        return { success: false, error: error.message };
      }
    }
    
    function updateResponse(result, endpoint) {
      const responseElem = document.getElementById('response');
      const time = new Date().toLocaleTimeString();
      
      if (result.success) {
        responseElem.innerHTML = `<span class="success">${time} - ${endpoint} succeeded:</span>\n${JSON.stringify(result.data, null, 2)}`;
      } else {
        responseElem.innerHTML = `<span class="error">${time} - ${endpoint} failed:</span>\n${result.error}`;
      }
    }
    
    async function testQuotes() {
      const endpoint = `/api/quotes?unique=${Date.now()}`;
      const result = await makeRequest(endpoint);
      updateResponse(result, 'Quotes API');
    }
    
    async function testDynamicQuotes() {
      const endpoint = `/api/quotes/dynamic?nocache=${Date.now()}`;
      const result = await makeRequest(endpoint);
      updateResponse(result, 'Dynamic Quotes API');
    }
    
    async function testMyStory() {
      const endpoint = `/api/my-story`;
      const result = await makeRequest(endpoint);
      updateResponse(result, 'My Story API');
    }
  </script>
</body>
</html>
